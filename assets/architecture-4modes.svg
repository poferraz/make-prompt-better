<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <pattern id="isoGridModes" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#141724" stroke-width="1" />
      <circle cx="28" cy="28" r="0.9" fill="#23283D" />
    </pattern>

    <linearGradient id="towerGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141724" />
      <stop offset="100%" stop-color="#0B0D14" />
    </linearGradient>

    <filter id="towerShadow" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="7" flood-color="#000000" flood-opacity="0.72" />
    </filter>

    <filter id="routerGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background & 3D Perspective Floor -->
  <rect width="1200" height="520" fill="#08090E" />
  <rect x="1" y="1" width="1198" height="518" fill="url(#isoGridModes)" stroke="#262A3B" stroke-width="1.5" />

