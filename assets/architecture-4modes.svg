  <rect x="1" y="1" width="1198" height="46" fill="#0D0F17" />
  <line x1="1" y1="47" x2="1199" y2="47" stroke="#262A3B" stroke-width="1.5" />
  <rect x="24" y="18" width="12" height="12" fill="#FF3B00">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite" />
