<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="muxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080C" />
      <stop offset="55%" stop-color="#0B0D14" />
      <stop offset="100%" stop-color="#080A10" />
    </linearGradient>

    <radialGradient id="prismAura" cx="32%" cy="50%" r="32%">
      <stop offset="0%" stop-color="#00E58B" stop-opacity="0.14" />
      <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#07080C" stop-opacity="0" />
    </radialGradient>

    <filter id="prismShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .mode-slot-1 { animation: focusMode1 8s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
      .mode-slot-2 { animation: focusMode2 8s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
      .mode-slot-3 { animation: focusMode3 8s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
      .mode-slot-4 { animation: focusMode4 8s cubic-bezier(0.16, 1, 0.3, 1) infinite; }

      .beam-1 { animation: fireBeam1 8s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
      .beam-2 { animation: fireBeam2 8s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
      .beam-3 { animation: fireBeam3 8s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
      .beam-4 { animation: fireBeam4 8s cubic-bezier(0.16, 1, 0.3, 1) infinite; }

      @keyframes focusMode1 {
        0%, 22% { opacity: 1; transform: translateX(6px); }
        26%, 96% { opacity: 0.42; transform: translateX(0px); }
        100% { opacity: 1; transform: translateX(6px); }
      }
      @keyframes focusMode2 {
        0%, 23% { opacity: 0.42; transform: translateX(0px); }
        27%, 47% { opacity: 1; transform: translateX(6px); }
        51%, 100% { opacity: 0.42; transform: translateX(0px); }
      }
      @keyframes focusMode3 {
        0%, 48% { opacity: 0.42; transform: translateX(0px); }
        52%, 72% { opacity: 1; transform: translateX(6px); }
        76%, 100% { opacity: 0.42; transform: translateX(0px); }
      }
      @keyframes focusMode4 {
        0%, 73% { opacity: 0.42; transform: translateX(0px); }
        77%, 97% { opacity: 1; transform: translateX(6px); }
        100% { opacity: 0.42; transform: translateX(0px); }
      }

      @keyframes fireBeam1 {
        0%, 22% { stroke: #00E58B; stroke-width: 2.5; stroke-opacity: 1; }
        26%, 96% { stroke: #23293D; stroke-width: 1.5; stroke-opacity: 0.55; }
        100% { stroke: #00E58B; stroke-width: 2.5; stroke-opacity: 1; }
      }
      @keyframes fireBeam2 {
        0%, 23% { stroke: #23293D; stroke-width: 1.5; stroke-opacity: 0.55; }
        27%, 47% { stroke: #00E58B; stroke-width: 2.5; stroke-opacity: 1; }
        51%, 100% { stroke: #23293D; stroke-width: 1.5; stroke-opacity: 0.55; }
      }
      @keyframes fireBeam3 {
        0%, 48% { stroke: #23293D; stroke-width: 1.5; stroke-opacity: 0.55; }
        52%, 72% { stroke: #FF5A36; stroke-width: 2.5; stroke-opacity: 1; }
        76%, 100% { stroke: #23293D; stroke-width: 1.5; stroke-opacity: 0.55; }
      }
      @keyframes fireBeam4 {
        0%, 73% { stroke: #23293D; stroke-width: 1.5; stroke-opacity: 0.55; }
        77%, 97% { stroke: #38BDF8; stroke-width: 2.5; stroke-opacity: 1; }
        100% { stroke: #23293D; stroke-width: 1.5; stroke-opacity: 0.55; }
      }

      @media (prefers-reduced-motion: reduce) {
        .mode-slot-1, .mode-slot-2, .mode-slot-3, .mode-slot-4 {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
        .beam-1, .beam-2, .beam-3, .beam-4 {
          animation: none !important;
          stroke: #00E58B !important;
          stroke-opacity: 0.75 !important;
        }
      }
    </style>
  </defs>

  <!-- Matte Stage -->
  <rect width="1200" height="380" rx="16" fill="url(#muxBg)" />
  <rect width="1200" height="380" rx="16" fill="url(#prismAura)" />
  <rect x="0.75" y="0.75" width="1198.5" height="378.5" rx="15.25" fill="none" stroke="#1E2231" stroke-width="1.5" />

  <!-- LEFT: Incoming Task & Model Classifier -->
  <g transform="translate(64, 152)">
    <text x="0" y="0" font-family="Inter, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#F5F3EC" letter-spacing="-0.03em">Model-Aware</text>
    <text x="0" y="32" font-family="Inter, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#F5F3EC" letter-spacing="-0.03em">Router</text>
    <text x="0" y="60" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="500" fill="#8292A8">Task class + model tier</text>
  </g>

  <!-- Incoming Optical Feed Line -->
  <line x1="256" y1="190" x2="366" y2="190" stroke="#F5F3EC" stroke-width="2.5" />

  <!-- 1-to-4 Optical Multiplexer Curves -->
  <path class="beam-1" d="M 380 190 C 440 190, 460 72, 528 72" fill="none" />
  <path class="beam-2" d="M 380 190 C 440 190, 460 150, 528 150" fill="none" />
  <path class="beam-3" d="M 380 190 C 440 190, 460 228, 528 228" fill="none" />
  <path class="beam-4" d="M 380 190 C 440 190, 460 306, 528 306" fill="none" />

  <!-- Central Optical Prism Node (x = 374, y = 190) -->
  <g transform="translate(374, 190)" filter="url(#prismShadow)">
    <polygon points="0,-26 24,0 0,26 -24,0" fill="#121624" stroke="#F5F3EC" stroke-width="1.5" />
    <circle cx="0" cy="0" r="5" fill="#00E58B" filter="url(#nodeGlow)" />
  </g>

  <!-- ================= RIGHT: 4 CLEAN MODE TRACKS (Outer group holds position; inner group holds CSS animation) ================= -->

  <!-- Track 1: Max Certificate -->
  <g transform="translate(544, 44)">
    <g class="mode-slot-1">
      <rect x="0" y="0" width="584" height="56" rx="10" fill="#0E121C" stroke="#23293D" stroke-width="1" />
      <text x="22" y="34" font-family="Inter, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#F5F3EC">Max Certificate</text>
      <text x="196" y="33" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="500" fill="#949AB1">Frontier LLMs  |  [P1..Pn] -&gt; [T1..Tn]</text>
      <text x="560" y="33" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" font-weight="700" fill="#00E58B">~2.2x</text>
    </g>
  </g>

  <!-- Track 2: Lite Certificate -->
  <g transform="translate(544, 122)">
    <g class="mode-slot-2">
      <rect x="0" y="0" width="584" height="56" rx="10" fill="#0E121C" stroke="#23293D" stroke-width="1" />
      <text x="22" y="34" font-family="Inter, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#F5F3EC">Lite Certificate</text>
      <text x="196" y="33" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="500" fill="#949AB1">Flash &amp; &lt;30B  |  Max 3 [P] + arrow trace</text>
      <text x="560" y="33" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" font-weight="700" fill="#00E58B">~1.5x</text>
    </g>
  </g>

  <!-- Track 3: LRM & Harness Mode -->
  <g transform="translate(544, 200)">
    <g class="mode-slot-3">
      <rect x="0" y="0" width="584" height="56" rx="10" fill="#0E121C" stroke="#23293D" stroke-width="1" />
      <text x="22" y="34" font-family="Inter, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#F5F3EC">LRM &amp; Harness</text>
      <text x="196" y="33" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="500" fill="#949AB1">o3 / R1 / CLAUDE.md  |  Code-First + [V1..V2]</text>
      <text x="560" y="33" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" font-weight="700" fill="#FF6B4A">~1.2x</text>
    </g>
  </g>

  <!-- Track 4: Divergent v2 -->
  <g transform="translate(544, 278)">
    <g class="mode-slot-4">
      <rect x="0" y="0" width="584" height="56" rx="10" fill="#0E121C" stroke="#23293D" stroke-width="1" />
      <text x="22" y="34" font-family="Inter, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#F5F3EC">Divergent v2</text>
      <text x="196" y="33" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="500" fill="#949AB1">Creative &amp; Copy  |  [NT0] p&lt;=0.20 + [SC0]</text>
      <text x="560" y="33" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" font-weight="700" fill="#38BDF8">~1.6x</text>
    </g>
  </g>
</svg>
