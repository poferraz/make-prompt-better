<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1200" height="540" rx="16" fill="url(#bg2)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Header -->
  <text x="48" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#F8FAFC">The v4.0 Optimization Pipeline &amp; 4 Certificate Modes</text>
  <text x="48" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#94A3B8">How raw prompts and context files are classified, stripped of goal bias, and compiled into verifiable certificates</text>

  <!-- Step 1: Input & Pre-Processing Row -->
  <rect x="48" y="100" width="240" height="84" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
  <text x="66" y="128" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700" fill="#38BDF8">STEP 1 • INPUT AUDIT</text>
  <text x="66" y="150" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">Raw Prompt / AGENTS.md</text>
  <text x="66" y="170" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94A3B8">Detect guesswork &amp; missing scope</text>

  <line x1="288" y1="142" x2="328" y2="142" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="336" y="100" width="260" height="84" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
  <text x="354" y="128" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700" fill="#F43F5E">STEP 2 • [GOAL-BLIND] + [PRISM]</text>
  <text x="354" y="150" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">Strip Goal Leakage &amp; Persona</text>
  <text x="354" y="170" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94A3B8">Omit persona on accuracy/LRM (-5pp risk)</text>

  <line x1="596" y1="142" x2="636" y2="142" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="644" y="100" width="250" height="84" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
  <text x="662" y="128" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700" fill="#FBBF24">STEP 3 • [HIERARCHY] + [ACE]</text>
  <text x="662" y="150" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">Authority Frame &amp; IDs</text>
  <text x="662" y="170" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94A3B8">Protocol preamble + [P1]/[T1] tags</text>

  <line x1="894" y1="142" x2="934" y2="142" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="942" y="100" width="210" height="84" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="960" y="128" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700" fill="#38BDF8">STEP 4 • ROUTE MODE</text>
  <text x="960" y="150" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">Select Certificate</text>
  <text x="960" y="170" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94A3B8">Match stakes &amp; model type</text>

  <!-- 4 Mode Columns -->
  <!-- Mode 1: Max -->
  <rect x="48" y="220" width="260" height="225" rx="12" fill="#131C31" stroke="#38BDF8" stroke-width="1.4"/>
  <text x="68" y="250" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" fill="#38BDF8">MODE 1 • ~2.2x TOKENS</text>
  <text x="68" y="274" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#F8FAFC">Max Certificate</text>
  <text x="68" y="296" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#94A3B8">High-stakes analytical tasks</text>
  <text x="68" y="324" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#E2E8F0">• [P1..Pn] Full Premises</text>
  <text x="68" y="346" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#E2E8F0">• [T1..Tn] Multi-step Traces</text>
  <text x="68" y="368" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#E2E8F0">• [C1] Bound Verdict &amp; Gaps</text>
  <text x="68" y="390" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#E2E8F0">• Mandatory Remediation</text>
  <text x="68" y="422" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#38BDF8">[META] [ACE] [CODE-SMELLS]</text>

  <!-- Mode 2: Lite -->
  <rect x="330" y="220" width="260" height="225" rx="12" fill="#131C31" stroke="#34D399" stroke-width="1.4"/>
  <text x="350" y="250" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" fill="#34D399">MODE 2 • ~1.5x TOKENS</text>
  <text x="350" y="274" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#F8FAFC">Lite Certificate</text>
  <text x="350" y="296" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#94A3B8">Routine code &amp; doc analysis</text>
  <text x="350" y="324" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#E2E8F0">• Max 3 [P] Premises</text>
  <text x="350" y="346" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#E2E8F0">• Single-line arrow traces:</text>
  <text x="350" y="366" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" fill="#34D399">  [T1] In → Step → Finding</text>
  <text x="350" y="390" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#E2E8F0">• 1-2 sentence Verdict + Fix</text>
  <text x="350" y="422" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#34D399">~80% traceability at lower cost</text>

  <!-- Mode 3: LRM / Harness -->
  <rect x="612" y="220" width="260" height="225" rx="12" fill="#131C31" stroke="#818CF8" stroke-width="1.4"/>
  <text x="632" y="250" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" fill="#818CF8">MODE 3 • ~1.2x TOKENS (NEW)</text>
  <text x="632" y="274" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#F8FAFC">LRM &amp; Harness Mode</text>
  <text x="632" y="296" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#94A3B8">o3 / R1 / Thinking &amp; AGENTS.md</text>
  <text x="632" y="324" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#E2E8F0">• Omit visible CoT narration</text>
  <text x="632" y="346" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#E2E8F0">• [V1..Vn] Verification Gates</text>
  <text x="632" y="368" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#E2E8F0">• Strip repo directory trees</text>
  <text x="632" y="390" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#E2E8F0">• Scratchpad Context-as-a-File</text>
  <text x="632" y="422" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#818CF8">[CONTEXT-FILES] [HARNESS]</text>

  <!-- Mode 4: Creative v2 -->
  <rect x="894" y="220" width="258" height="225" rx="12" fill="#131C31" stroke="#C084FC" stroke-width="1.4"/>
  <text x="914" y="250" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" fill="#C084FC">MODE 4 • ~1.6x TOKENS (NEW)</text>
  <text x="914" y="274" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#F8FAFC">Creative &amp; Divergent v2</text>
  <text x="914" y="296" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#94A3B8">Essays, copy &amp; ideation</text>
  <text x="914" y="324" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#E2E8F0">• [NT0] Verbalized Sampling</text>
  <text x="914" y="346" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" fill="#C084FC">  Pick angle with p &lt;= 0.20</text>
  <text x="914" y="368" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#E2E8F0">• [NT1..3] Narrative Traces</text>
  <text x="914" y="390" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#E2E8F0">• 4 Anti-SlopShape Rules</text>
  <text x="914" y="422" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#C084FC">[VS] [SLOPSHAPE]</text>

  <!-- Bottom Guard Bar -->
  <rect x="48" y="465" width="1104" height="50" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
  <text x="72" y="495" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" font-weight="600" fill="#F8FAFC">
    MANDATORY POST-GUARDS (<tspan fill="#38BDF8">[SKILLS-SDO]</tspan> + <tspan fill="#34D399">[META]</tspan>): <tspan font-weight="400" fill="#CBD5E1">Positive Observable-Predicate Recipes • Remediation Block • Traceability Self-Check</tspan>
  </text>
</svg>
