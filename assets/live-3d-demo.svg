    <text x="20" y="28" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#F3F0E6" letter-spacing="0.08em">STAGE 02 // ROUTE &amp; BIND</text>
    <text x="20" y="56" font-family="Inter, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#F3F0E6">Compile AST Certificate</text>
    <text x="20" y="78" font-family="Inter, sans-serif" font-size="13" fill="#9A9891">Routes by model tier &amp; task complexity:</text>

