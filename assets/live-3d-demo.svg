  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-7; 0,0" dur="4s" repeatCount="indefinite"/>
    <rect x="56" y="96" width="300" height="310" rx="16" fill="#020617" stroke="#334155" stroke-width="1"/>
    <rect x="48" y="86" width="300" height="310" rx="16" fill="url(#termCard)" stroke="#475569" stroke-width="1.5"/>

    <circle cx="72" cy="112" r="5" fill="#F43F5E"/>
    <circle cx="88" cy="112" r="5" fill="#FBBF24"/>
    <circle cx="104" cy="112" r="5" fill="#34D399"/>
    <text x="124" y="116" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#94A3B8">1. TRIGGER</text>

    <rect x="68" y="138" width="260" height="44" rx="10" fill="#090D16" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="82" y="165" font-family="ui-monospace, monospace" font-size="14" font-weight="800" fill="#38BDF8">&gt; /make-prompt-better</text>
    <rect x="276" y="152" width="8" height="16" fill="#38BDF8">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <text x="68" y="212" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#64748B">STRIPPED AUTOMATICALLY</text>

    <rect x="68" y="226" width="260" height="40" rx="8" fill="#1F1224" stroke="#F43F5E" stroke-width="1.2"/>
    <text x="84" y="251" font-family="ui-monospace, monospace" font-size="12.5" font-weight="700" fill="#FDA4AF">✕ Persona (-5.3% MMLU)</text>

    <rect x="68" y="278" width="260" height="40" rx="8" fill="#1F1224" stroke="#FB923C" stroke-width="1.2"/>
    <text x="84" y="303" font-family="ui-monospace, monospace" font-size="12.5" font-weight="700" fill="#FDBA74">✕ Goal Bias (arXiv:2602)</text>

    <rect x="68" y="330" width="260" height="40" rx="8" fill="#1F1224" stroke="#FBBF24" stroke-width="1.2"/>
    <text x="84" y="355" font-family="ui-monospace, monospace" font-size="12.5" font-weight="700" fill="#FDE68A">✕ Repo Bloat (+20% Cost)</text>
  </g>

  <!-- 3D MOTION DATA STREAMS (LEFT -> CENTER) -->
  <path d="M 348 170 C 395 170, 410 125, 456 125" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="6 4"/>
  <path d="M 348 220 C 395 220, 410 205, 456 205" fill="none" stroke="#34D399" stroke-width="2.5" stroke-dasharray="6 4"/>
  <path d="M 348 265 C 395 265, 410 285, 456 285" fill="none" stroke="#818CF8" stroke-width="2.5" stroke-dasharray="6 4"/>
  <path d="M 348 310 C 395 310, 410 365, 456 365" fill="none" stroke="#C084FC" stroke-width="2.5" stroke-dasharray="6 4"/>

  <circle r="5" fill="#38BDF8" filter="url(#neon)">
