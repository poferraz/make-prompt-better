    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="3.4s" begin="0.3s" repeatCount="indefinite"/>

    <rect x="462" y="96" width="280" height="64" rx="12" fill="#020617"/>
    <rect x="456" y="90" width="280" height="64" rx="12" fill="#131C31" stroke="#38BDF8" stroke-width="1.8"/>
    <text x="476" y="118" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#F8FAFC">Mode 1 • Max</text>
    <text x="716" y="118" text-anchor="end" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#38BDF8">FRONTIER</text>
    <text x="476" y="140" font-family="ui-monospace, monospace" font-size="12" fill="#94A3B8">[P1] → [T1] → [C1] + Patch</text>

    <rect x="462" y="176" width="280" height="64" rx="12" fill="#020617"/>
    <rect x="456" y="170" width="280" height="64" rx="12" fill="#131C31" stroke="#34D399" stroke-width="1.8"/>
    <text x="476" y="198" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#F8FAFC">Mode 2 • Lite</text>
    <text x="716" y="198" text-anchor="end" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#34D399">FLASH / &lt;30B</text>
