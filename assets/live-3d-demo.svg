    <text x="890" y="116" font-family="ui-monospace, monospace" font-size="11.5" font-weight="800" fill="#34D399">3. VERIFIED GAIN</text>

    <text x="872" y="154" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">Frontier Quality</text>
    <text x="1124" y="154" text-anchor="end" font-family="ui-monospace, monospace" font-size="14" font-weight="800" fill="#34D399">24.8 / 25</text>
    <rect x="872" y="164" width="252" height="12" rx="6" fill="#090D16"/>
    <rect x="872" y="164" width="248" height="12" rx="6" fill="url(#greenBar)">
      <animate attributeName="width" values="180;248;248" dur="3s" repeatCount="indefinite"/>
    </rect>

    <text x="872" y="210" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">Traceability Leap</text>
    <text x="1124" y="210" text-anchor="end" font-family="ui-monospace, monospace" font-size="14" font-weight="800" fill="#38BDF8">+1.66 / 5.0</text>
    <rect x="872" y="220" width="252" height="12" rx="6" fill="#090D16"/>
    <rect x="872" y="220" width="225" height="12" rx="6" fill="url(#blueBar)">
      <animate attributeName="width" values="120;225;225" dur="3s" repeatCount="indefinite"/>
    </rect>

    <text x="872" y="266" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">Creative Diversity</text>
    <text x="1124" y="266" text-anchor="end" font-family="ui-monospace, monospace" font-size="14" font-weight="800" fill="#C084FC">2.1x Lift</text>
    <rect x="872" y="276" width="252" height="12" rx="6" fill="#090D16"/>
    <rect x="872" y="276" width="236" height="12" rx="6" fill="url(#purpleBar)">
      <animate attributeName="width" values="110;236;236" dur="3s" repeatCount="indefinite"/>
    </rect>

    <rect x="872" y="314" width="252" height="58" rx="10" fill="#064E3B" fill-opacity="0.35" stroke="#34D399" stroke-width="1.2"/>
    <text x="998" y="339" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="800" fill="#34D399">✓ DATA-BOUND &amp; VERIFIED</text>
    <text x="998" y="358" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" fill="#A7F3D0">12 Ready-to-Use Templates</text>
  </g>

  <text x="198" y="444" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#64748B">STEP 1 • STRIP FOLK TRAPS</text>
  <text x="596" y="444" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#64748B">STEP 2 • ROUTE BY MODEL &amp; TASK</text>
  <text x="998" y="444" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#64748B">STEP 3 • EMIT BOUND CERTIFICATE</text>
</svg>
