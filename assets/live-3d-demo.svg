    <g transform="translate(18, 94)">
      <rect x="0" y="0" width="310" height="36" fill="#131724" stroke="#2C324C" stroke-width="1" />
      <rect x="0" y="0" width="4" height="36" fill="#F3F0E6" />
      <text x="14" y="23" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#F3F0E6">[01] Frontier -&gt; Mode 1 Max Certificate</text>

      <rect x="0" y="42" width="310" height="36" fill="#131724" stroke="#2C324C" stroke-width="1" />
      <rect x="0" y="42" width="4" height="36" fill="#00E58B" />
      <text x="14" y="65" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#00E58B">[02] Flash/&lt;30B -&gt; Mode 2 Lite (&lt;=3 Prem)</text>

      <rect x="0" y="84" width="310" height="36" fill="#131724" stroke="#2C324C" stroke-width="1" />
      <rect x="0" y="84" width="4" height="36" fill="#FF6B4A" />
      <text x="14" y="107" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#FF6B4A">[03] LRM/Context -&gt; Mode 3 Code-First</text>

      <rect x="0" y="126" width="310" height="36" fill="#131724" stroke="#2C324C" stroke-width="1" />
      <rect x="0" y="126" width="4" height="36" fill="#38BDF8" />
      <text x="14" y="149" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#38BDF8">[04] Writing -&gt; Mode 4 Tail Angle (p&lt;=.2)</text>
    </g>
  </g>

  <!-- 3D Isometric Conduit 2 -> 3 with Animated Streaming Packets -->
  <g>
    <polygon points="774,225 830,225 836,219 780,219" fill="#133829" />
    <rect x="774" y="225" width="56" height="20" fill="#0A1E16" stroke="#1B5E43" stroke-width="1" />
    <line x1="774" y1="235" x2="830" y2="235" stroke="#00E58B" stroke-width="2" stroke-dasharray="6 4">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="0.7s" repeatCount="indefinite" />
    </line>
    <circle r="5" fill="#00E58B" filter="url(#packetGlow)">
      <animateMotion dur="1.2s" repeatCount="indefinite">
        <mpath href="#conduitPath2" />
      </animateMotion>
    </circle>
  </g>

  <!-- ================= STAGE 03: 3D MONOLITH CHAMBER (VERIFIED OUTPUT EMISSION) ================= -->
  <g transform="translate(828, 72)" filter="url(#drop3D)">
    <animateTransform attributeName="transform" type="translate" values="828,72; 828,65; 828,72" dur="4.4s" repeatCount="indefinite" />

    <!-- 3D Extruded Chamber Outer Shell -->
    <polygon points="0,0 12,-12 356,-12 344,0" fill="#154734" stroke="#00E58B" stroke-width="0.8" />
    <polygon points="344,0 356,-12 356,268 344,280" fill="#05140E" stroke="#185A3F" stroke-width="0.8" />
    <rect x="0" y="0" width="344" height="280" fill="url(#chamberEmerald)" stroke="#1E6B4C" stroke-width="1.2" />
    <rect x="0" y="0" width="344" height="4" fill="#00E58B" />

    <!-- Levitating 3D Isometric Cube Icon (Stage 03) -->
    <g transform="translate(304, 36)">
      <animateTransform attributeName="transform" type="translate" values="304,33; 304,42; 304,33" dur="2.4s" repeatCount="indefinite" />
      <polygon points="0,-14 14,-7 0,0 -14,-7" fill="#6EE7B7" />
      <polygon points="-14,-7 0,0 0,14 -14,7" fill="#00E58B" />
      <polygon points="0,0 14,-7 14,7 0,14" fill="#047857" />
    </g>

    <text x="20" y="28" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#00E58B" letter-spacing="0.08em">STAGE 03 // VERIFY &amp; EMIT</text>
    <text x="20" y="56" font-family="Inter, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#F3F0E6">Auditable Deliverable</text>
    <text x="20" y="78" font-family="Inter, sans-serif" font-size="13" fill="#A7F3D0">Every conclusion locked to a trace ID:</text>

    <!-- 3D Inner Verified Receipts -->
    <g transform="translate(18, 94)">
      <rect x="0" y="0" width="308" height="50" fill="#0A1F17" stroke="#1C6447" stroke-width="1" />
      <rect x="0" y="0" width="4" height="50" fill="#00E58B" />
      <text x="14" y="21" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#00E58B">[+] 24.83 / 25 Peak Quality Score</text>
      <text x="14" y="39" font-family="Inter, sans-serif" font-size="12" fill="#E6E2D8">Verified on Frontier 12-domain suite</text>

      <rect x="0" y="58" width="308" height="50" fill="#0A1F17" stroke="#1C6447" stroke-width="1" />
      <rect x="0" y="58" width="4" height="50" fill="#00E58B" />
      <text x="14" y="79" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#00E58B">[+] +1.66 Avg Traceability Lift</text>
      <text x="14" y="97" font-family="Inter, sans-serif" font-size="12" fill="#E6E2D8">Zero ungrounded or orphan assertions</text>

      <rect x="0" y="116" width="308" height="50" fill="#0A1F17" stroke="#1C6447" stroke-width="1" />
      <rect x="0" y="116" width="4" height="50" fill="#00E58B" />
      <text x="14" y="137" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#00E58B">[+] Compact 6-Line CLI Receipt</text>
      <text x="14" y="155" font-family="Inter, sans-serif" font-size="12" fill="#E6E2D8">80-column ergonomic + copy-paste patch</text>
    </g>
  </g>

  <!-- Full-Width 3D Optical Fiber Telemetry Bus (y = 374) -->
  <line x1="40" y1="374" x2="1160" y2="374" stroke="#23283D" stroke-width="3" />
  <circle r="4" fill="#00E58B" filter="url(#packetGlow)">
    <animateMotion dur="4.5s" repeatCount="indefinite">
      <mpath href="#fullPipelineRail" />
    </animateMotion>
  </circle>
  <circle r="4" fill="#FF3B00" filter="url(#packetGlow)">
    <animateMotion dur="4.5s" begin="2.25s" repeatCount="indefinite">
      <mpath href="#fullPipelineRail" />
    </animateMotion>
  </circle>

  <!-- Bottom Archival Paper Callout Strip (y: 404 -> 459) -->
  <rect x="1" y="404" width="1198" height="55" fill="#F3F0E6" />
  <line x1="1" y1="404" x2="1199" y2="404" stroke="#262A3B" stroke-width="1.5" />
  <text x="24" y="437" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" font-weight="800" fill="#0B0B0D" letter-spacing="0.05em">BENCHMARK OUTCOME //  108 WINS (74.0%)   |   94.1% FRONTIER WIN RATE   |   +4.41 CREATIVE LIFT   |   +3.11 FINANCE LIFT</text>
</svg>
