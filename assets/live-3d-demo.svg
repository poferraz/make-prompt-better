  </circle>
  <circle r="5" fill="#34D399" filter="url(#neon)">
    <animateMotion dur="1.6s" begin="0.4s" repeatCount="indefinite" path="M 348 220 C 395 220, 410 205, 456 205"/>
  </circle>
  <circle r="5" fill="#818CF8" filter="url(#neon)">
    <animateMotion dur="1.6s" begin="0.8s" repeatCount="indefinite" path="M 348 265 C 395 265, 410 285, 456 285"/>
  </circle>
  <circle r="5" fill="#C084FC" filter="url(#neon)">
    <animateMotion dur="1.6s" begin="1.2s" repeatCount="indefinite" path="M 348 310 C 395 310, 410 365, 456 365"/>
  </circle>

