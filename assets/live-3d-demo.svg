    <rect x="462" y="256" width="280" height="64" rx="12" fill="#020617"/>
    <rect x="456" y="250" width="280" height="64" rx="12" fill="#131C31" stroke="#818CF8" stroke-width="1.8"/>
    <text x="476" y="278" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#F8FAFC">Mode 3 • Harness</text>
    <text x="716" y="278" text-anchor="end" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#818CF8">LRM / AGENTS.md</text>
    <text x="476" y="300" font-family="ui-monospace, monospace" font-size="12" fill="#94A3B8">Code First → [V1] → [V2]</text>

    <rect x="462" y="336" width="280" height="64" rx="12" fill="#020617"/>
    <rect x="456" y="330" width="280" height="64" rx="12" fill="#131C31" stroke="#C084FC" stroke-width="1.8"/>
    <text x="476" y="358" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#F8FAFC">Mode 4 • Creative v2</text>
    <text x="716" y="358" text-anchor="end" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#C084FC">+4.41 LIFT</text>
    <text x="476" y="380" font-family="ui-monospace, monospace" font-size="12" fill="#94A3B8">[NT0] p&lt;=0.20 + Anti-Slop</text>
  </g>

  <!-- 3D MOTION DATA STREAMS (CENTER -> RIGHT) -->
  <path d="M 736 122 C 785 122, 800 190, 848 190" fill="none" stroke="#38BDF8" stroke-width="2.5"/>
  <path d="M 736 202 C 785 202, 800 225, 848 225" fill="none" stroke="#34D399" stroke-width="2.5"/>
  <path d="M 736 282 C 785 282, 800 260, 848 260" fill="none" stroke="#818CF8" stroke-width="2.5"/>
  <path d="M 736 362 C 785 362, 800 295, 848 295" fill="none" stroke="#C084FC" stroke-width="2.5"/>

  <circle r="5.5" fill="#34D399" filter="url(#neon)">
    <animateMotion dur="1.4s" repeatCount="indefinite" path="M 736 122 C 785 122, 800 190, 848 190"/>
  </circle>
  <circle r="5.5" fill="#38BDF8" filter="url(#neon)">
    <animateMotion dur="1.4s" begin="0.7s" repeatCount="indefinite" path="M 736 282 C 785 282, 800 260, 848 260"/>
  </circle>

  <!-- STAGE 3 (RIGHT 3D STACK): MEASURED IMPACT DASHBOARD -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-7; 0,0" dur="4s" begin="0.6s" repeatCount="indefinite"/>
    <rect x="856" y="96" width="300" height="310" rx="16" fill="#020617" stroke="#334155" stroke-width="1"/>
    <rect x="848" y="86" width="300" height="310" rx="16" fill="url(#termCard)" stroke="#34D399" stroke-width="1.8"/>

    <circle cx="874" cy="112" r="5" fill="#34D399">
