<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%">
  <defs>
    <pattern id="isoGridDemo" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#141724" stroke-width="1" />
      <circle cx="28" cy="28" r="0.9" fill="#23283D" />
    </pattern>

    <linearGradient id="chamberDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141724" />
      <stop offset="100%" stop-color="#0B0D14" />
    </linearGradient>

    <linearGradient id="chamberEmerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E261D" />
      <stop offset="100%" stop-color="#07140F" />
    </linearGradient>

    <filter id="drop3D" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <filter id="packetGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Motion Paths for 3D Pipeline Data Packets -->
    <path id="conduitPath1" d="M 374 235 L 430 235" />
    <path id="conduitPath2" d="M 774 235 L 830 235" />
    <path id="fullPipelineRail" d="M 60 374 L 1140 374" />
  </defs>

  <!-- Background & 3D Isometric Perspective Grid -->
  <rect width="1200" height="460" fill="#08090E" />
  <rect x="1" y="1" width="1198" height="458" fill="url(#isoGridDemo)" stroke="#262A3B" stroke-width="1.5" />

  <!-- 3D Perspective Floor Grid Lines -->
  <g stroke="#1B1F30" stroke-width="1">
    <line x1="600" y1="80" x2="50" y2="404" />
    <line x1="600" y1="80" x2="320" y2="404" />
    <line x1="600" y1="80" x2="600" y2="404" />
    <line x1="600" y1="80" x2="880" y2="404" />
    <line x1="600" y1="80" x2="1150" y2="404" />
  </g>

  <!-- Top Telemetry Bar -->
  <rect x="1" y="1" width="1198" height="44" fill="#0D0F17" />
  <line x1="1" y1="45" x2="1199" y2="45" stroke="#262A3B" stroke-width="1.5" />
  <rect x="24" y="16" width="12" height="12" fill="#FF3B00">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite" />
  </rect>
  <text x="46" y="27" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" font-weight="700" fill="#F3F0E6" letter-spacing="0.08em">FIG. 02 // 3D COMPILATION PIPELINE (RAW PROMPT -&gt; AST ROUTER -&gt; VERIFIED CERTIFICATE)</text>
  <text x="875" y="27" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#00E58B">3D STREAM: ACTIVE (60FPS)</text>

  <!-- ================= STAGE 01: 3D MONOLITH CHAMBER (LEXICAL & BIAS STRIPPER) ================= -->
  <g transform="translate(28, 72)" filter="url(#drop3D)">
    <animateTransform attributeName="transform" type="translate" values="28,72; 28,66; 28,72" dur="4.6s" repeatCount="indefinite" />

    <!-- 3D Extruded Chamber Outer Shell -->
    <polygon points="0,0 12,-12 358,-12 346,0" fill="#28181A" stroke="#FF3B00" stroke-width="0.8" />
    <polygon points="346,0 358,-12 358,268 346,280" fill="#12090B" stroke="#4D1F1A" stroke-width="0.8" />
    <rect x="0" y="0" width="346" height="280" fill="url(#chamberDark)" stroke="#382024" stroke-width="1.2" />
    <rect x="0" y="0" width="346" height="4" fill="#FF3B00" />

    <!-- Levitating 3D Isometric Cube Icon (Stage 01) -->
    <g transform="translate(306, 36)">
      <animateTransform attributeName="transform" type="translate" values="306,33; 306,41; 306,33" dur="2.6s" repeatCount="indefinite" />
      <polygon points="0,-14 14,-7 0,0 -14,-7" fill="#FF6B4A" />
      <polygon points="-14,-7 0,0 0,14 -14,7" fill="#C82800" />
      <polygon points="0,0 14,-7 14,7 0,14" fill="#7D1900" />
    </g>

    <text x="20" y="28" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#FF3B00" letter-spacing="0.08em">STAGE 01 // SANITIZE INPUT</text>
    <text x="20" y="56" font-family="Inter, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#F3F0E6">Strip Folk Prompting</text>
    <text x="20" y="78" font-family="Inter, sans-serif" font-size="13" fill="#9A9891">Pre-flight filter removes attention traps:</text>

    <!-- 3D Inner Sub-Cards -->
    <g transform="translate(18, 94)">
      <rect x="0" y="0" width="310" height="50" fill="#181014" stroke="#4A2022" stroke-width="1" />
      <rect x="0" y="0" width="4" height="50" fill="#FF3B00" />
      <text x="14" y="21" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#FF6B4A">[-] Persona Flattery (arXiv:2603.18507)</text>
      <text x="14" y="39" font-family="Inter, sans-serif" font-size="12" fill="#A8A69E">Eliminates -5.3pp MMLU fabrication drop</text>

      <rect x="0" y="58" width="310" height="50" fill="#181014" stroke="#4A2022" stroke-width="1" />
      <rect x="0" y="58" width="4" height="50" fill="#FF3B00" />
      <text x="14" y="79" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#FF6B4A">[-] Goal &amp; Stake Bias (arXiv:2602.09504)</text>
      <text x="14" y="97" font-family="Inter, sans-serif" font-size="12" fill="#A8A69E">Strips "for client demo" agenda leakage</text>

      <rect x="0" y="116" width="310" height="50" fill="#181014" stroke="#4A2022" stroke-width="1" />
      <rect x="0" y="116" width="4" height="50" fill="#FF3B00" />
      <text x="14" y="137" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#FF6B4A">[-] /init Folder Trees (arXiv:2602.11988)</text>
      <text x="14" y="155" font-family="Inter, sans-serif" font-size="12" fill="#A8A69E">Saves &gt;20% context tokens in CLAUDE.md</text>
    </g>
  </g>

  <!-- 3D Isometric Conduit 1 -> 2 with Animated Streaming Packets -->
  <g>
    <polygon points="374,225 430,225 436,219 380,219" fill="#1F2437" />
    <rect x="374" y="225" width="56" height="20" fill="#0F131F" stroke="#2E3652" stroke-width="1" />
    <line x1="374" y1="235" x2="430" y2="235" stroke="#FF3B00" stroke-width="2" stroke-dasharray="6 4">
