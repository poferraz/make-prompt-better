<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080C" />
      <stop offset="50%" stop-color="#0B0D14" />
      <stop offset="100%" stop-color="#080A10" />
    </linearGradient>

    <linearGradient id="opticalAxis" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5A36" stop-opacity="0.2" />
      <stop offset="22%" stop-color="#FF5A36" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#F5F3EC" stop-opacity="0.85" />
      <stop offset="82%" stop-color="#00E58B" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#00E58B" stop-opacity="0.2" />
    </linearGradient>

    <radialGradient id="gateGlow1" cx="22%" cy="52%" r="22%">
      <stop offset="0%" stop-color="#FF5A36" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#07080C" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="gateGlow3" cx="78%" cy="52%" r="24%">
      <stop offset="0%" stop-color="#00E58B" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#07080C" stop-opacity="0" />
    </radialGradient>

    <filter id="lensShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <filter id="beamBloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .gate-ring-1 {
        animation: pulseGate1 4.8s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }
      .gate-ring-2 {
        animation: pulseGate2 4.8s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }
      .gate-ring-3 {
        animation: pulseGate3 4.8s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }
      .shed-fluff {
        animation: shedRing 4.8s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        transform-origin: 260px 168px;
      }
      .lock-pass {
        animation: passLock 4.8s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        transform-origin: 940px 168px;
      }

      @keyframes pulseGate1 {
        0%, 8% { stroke-opacity: 0.35; }
        18%, 32% { stroke-opacity: 1; }
        45%, 100% { stroke-opacity: 0.35; }
      }
      @keyframes pulseGate2 {
        0%, 35% { stroke-opacity: 0.35; }
        48%, 62% { stroke-opacity: 1; }
        78%, 100% { stroke-opacity: 0.35; }
      }
      @keyframes pulseGate3 {
        0%, 65% { stroke-opacity: 0.35; }
        78%, 94% { stroke-opacity: 1; }
        100% { stroke-opacity: 0.35; }
      }
      @keyframes shedRing {
        0%, 14% { opacity: 0; transform: scale(0.8); }
        22% { opacity: 0.95; transform: scale(1); }
        38%, 100% { opacity: 0; transform: scale(1.45); }
      }
      @keyframes passLock {
        0%, 70% { opacity: 0; transform: scale(0.85); }
        82%, 94% { opacity: 1; transform: scale(1.18); }
        100% { opacity: 0; transform: scale(1.35); }
      }

      @media (prefers-reduced-motion: reduce) {
        .gate-ring-1, .gate-ring-2, .gate-ring-3, .shed-fluff, .lock-pass {
          animation: none !important;
          stroke-opacity: 0.9 !important;
        }
      }
    </style>
  </defs>

  <!-- Matte Stage -->
  <rect width="1200" height="340" rx="16" fill="url(#pipeBg)" />
  <rect width="1200" height="340" rx="16" fill="url(#gateGlow1)" />
  <rect width="1200" height="340" rx="16" fill="url(#gateGlow3)" />
  <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="15.25" fill="none" stroke="#1E2231" stroke-width="1.5" />

  <!-- Continuous Optical Axis Line -->
  <line x1="96" y1="168" x2="1104" y2="168" stroke="#1D2233" stroke-width="4" stroke-linecap="round" />
  <line x1="96" y1="168" x2="1104" y2="168" stroke="url(#opticalAxis)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Animated Travelling Token Capsule along the Optical Axis -->
  <g filter="url(#beamBloom)">
    <rect x="-26" y="-8" width="52" height="16" rx="8" fill="#F5F3EC">
      <animateMotion path="M 120 168 L 1080 168" dur="4.8s" repeatCount="indefinite" />
      <animate attributeName="fill" values="#FF5A36;#FF5A36;#F5F3EC;#00E58B;#00E58B" keyTimes="0;0.24;0.52;0.8;1" dur="4.8s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- ================= LENS 1: SANITIZE (x = 260) ================= -->
  <circle class="shed-fluff" cx="260" cy="168" r="56" fill="none" stroke="#FF5A36" stroke-width="1.5" stroke-dasharray="4 4" />
  <g transform="translate(260, 168)" filter="url(#lensShadow)">
    <circle cx="0" cy="0" r="46" fill="#0E111A" stroke="#28222B" stroke-width="1.5" />
    <circle class="gate-ring-1" cx="0" cy="0" r="46" fill="none" stroke="#FF5A36" stroke-width="2" />
    <text x="0" y="5" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="700" fill="#FF6B4A">[-FLUFF]</text>
  </g>
  <text x="260" y="256" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#F5F3EC" letter-spacing="-0.02em">Sanitize Input</text>
  <text x="260" y="280" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="500" fill="#8292A8">Strips persona &amp; goal bias</text>

  <!-- ================= LENS 2: BIND & ROUTE (x = 600) ================= -->
  <g transform="translate(600, 168)" filter="url(#lensShadow)">
    <circle cx="0" cy="0" r="46" fill="#0E111A" stroke="#262C3F" stroke-width="1.5" />
    <circle class="gate-ring-2" cx="0" cy="0" r="46" fill="none" stroke="#F5F3EC" stroke-width="2" />
    <text x="0" y="5" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="700" fill="#F5F3EC">[P1..T1]</text>
  </g>
  <text x="600" y="256" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#F5F3EC" letter-spacing="-0.02em">Bind &amp; Route</text>
  <text x="600" y="280" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="500" fill="#8292A8">Matches mode to model tier</text>

  <!-- ================= LENS 3: VERIFY & EMIT (x = 940) ================= -->
  <circle class="lock-pass" cx="940" cy="168" r="56" fill="none" stroke="#00E58B" stroke-width="2" />
  <g transform="translate(940, 168)" filter="url(#lensShadow)">
    <circle cx="0" cy="0" r="46" fill="#0B1915" stroke="#184A38" stroke-width="1.5" />
    <circle class="gate-ring-3" cx="0" cy="0" r="46" fill="none" stroke="#00E58B" stroke-width="2.2" />
    <text x="0" y="5" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="700" fill="#00E58B">[VERIFIED]</text>
  </g>
  <text x="940" y="256" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#F5F3EC" letter-spacing="-0.02em">Verify &amp; Emit</text>
  <text x="940" y="280" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="500" fill="#00E58B">Zero ungrounded claims</text>
</svg>
