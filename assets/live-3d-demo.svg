<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDemo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0B1325"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="termCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="greenBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="blueBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="purpleBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <pattern id="grid3d" width="56" height="32" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 56 16 L 28 32 L 0 16 Z" fill="none" stroke="#1E293B" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="1200" height="480" rx="20" fill="url(#bgDemo)" stroke="#1E293B" stroke-width="1.5"/>
  <rect width="1200" height="480" rx="20" fill="url(#grid3d)" opacity="0.55"/>

  <text x="48" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="900" fill="#F8FAFC">3D Live Pipeline: How /make-prompt-better Works in Your Agent</text>
  <text x="1152" y="44" text-anchor="end" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#38BDF8">ZERO-FRICTION EXECUTION</text>

