<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <linearGradient id="stageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080C" />
      <stop offset="55%" stop-color="#0B0D14" />
      <stop offset="100%" stop-color="#080A10" />
    </linearGradient>

    <radialGradient id="lensAura" cx="72%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#00E58B" stop-opacity="0.16" />
      <stop offset="45%" stop-color="#38BDF8" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#07080C" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="rawAura" cx="54%" cy="50%" r="26%">
      <stop offset="0%" stop-color="#FF5A36" stop-opacity="0.13" />
      <stop offset="100%" stop-color="#07080C" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="glassLens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="45%" stop-color="#38BDF8" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#00E58B" stop-opacity="0.18" />
    </linearGradient>

    <linearGradient id="lensEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#00E58B" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="beamIn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5A36" stop-opacity="0" />
      <stop offset="65%" stop-color="#FF5A36" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="beamOut" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#00E58B" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#00E58B" stop-opacity="0" />
    </linearGradient>

    <filter id="softElevation" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <filter id="opticalBloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .raw-token-1 {
        animation: redactToken 6s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }
      .raw-token-2 {
        animation: redactToken 6s cubic-bezier(0.16, 1, 0.3, 1) 0.18s infinite;
      }
      .raw-token-3 {
        animation: redactToken 6s cubic-bezier(0.16, 1, 0.3, 1) 0.36s infinite;
      }
      .strike-line {
        stroke-dasharray: 180;
        stroke-dashoffset: 0;
        animation: strikeDraw 6s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }
      .cert-row-1 {
        animation: certReveal 6s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }
      .cert-row-2 {
        animation: certReveal 6s cubic-bezier(0.16, 1, 0.3, 1) 0.16s infinite;
      }
      .cert-row-3 {
        animation: certReveal 6s cubic-bezier(0.16, 1, 0.3, 1) 0.32s infinite;
      }
      .lens-flare {
        animation: lensPulse 6s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }
      .caret-blink {
        animation: blinkCaret 1.1s step-end infinite;
      }

      @keyframes strikeDraw {
        0%, 55% { stroke-dashoffset: 0; opacity: 1; }
        70%, 82% { stroke-dashoffset: 180; opacity: 0; }
        95%, 100% { stroke-dashoffset: 0; opacity: 1; }
      }
      @keyframes redactToken {
        0%, 55% { opacity: 0.42; transform: translateX(4px); }
        70%, 82% { opacity: 0.95; transform: translateX(0px); }
        95%, 100% { opacity: 0.42; transform: translateX(4px); }
      }
      @keyframes certReveal {
        0%, 62% { opacity: 1; transform: translateX(0px); }
        76%, 86% { opacity: 0.25; transform: translateX(-8px); }
        96%, 100% { opacity: 1; transform: translateX(0px); }
      }
      @keyframes lensPulse {
        0%, 60% { opacity: 0.95; }
        75%, 85% { opacity: 0.4; }
        96%, 100% { opacity: 0.95; }
      }
      @keyframes blinkCaret {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .raw-token-1, .raw-token-2, .raw-token-3,
        .strike-line, .cert-row-1, .cert-row-2, .cert-row-3,
        .lens-flare, .caret-blink {
          animation: none !important;
          opacity: 1 !important;
          stroke-dashoffset: 0 !important;
          transform: none !important;
        }
      }
    </style>
  </defs>

  <!-- Deep Matte Carbon Stage -->
  <rect width="1200" height="500" rx="16" fill="url(#stageBg)" />
  <rect width="1200" height="500" rx="16" fill="url(#rawAura)" />
  <rect width="1200" height="500" rx="16" fill="url(#lensAura)" />
  <rect x="0.75" y="0.75" width="1198.5" height="498.5" rx="15.25" fill="none" stroke="#1E2231" stroke-width="1.5" />

  <!-- Subtle Optical Horizon Axis -->
  <line x1="548" y1="250" x2="1148" y2="250" stroke="#1A1E2D" stroke-width="1" />

  <!-- ================= LEFT STAGE: WEBSITE HERO MESSAGE (x: 48 -> 496) ================= -->
  <g transform="translate(48, 136)">
    <text x="0" y="0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="40" font-weight="800" fill="#F5F3EC" letter-spacing="-0.035em">Prompts are not prose.</text>
    <text x="0" y="50" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="40" font-weight="800" fill="#F5F3EC" letter-spacing="-0.035em">Compile them into <tspan fill="#00E58B">proofs.</tspan></text>

    <text x="2" y="96" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#949AB1">Strip roleplay fluff and goal bias. Emit verifiable certificates.</text>

    <!-- Single Tactile CLI Pill -->
    <g transform="translate(0, 140)" filter="url(#softElevation)">
      <rect x="0" y="0" width="388" height="50" rx="10" fill="#10131D" stroke="#252B3F" stroke-width="1.2" />
      <text x="20" y="30" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="14" font-weight="600" fill="#00E58B">$</text>
      <text x="38" y="30" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="14" font-weight="500" fill="#F5F3EC">npx make-prompt-better init</text>
      <rect class="caret-blink" x="276" y="16" width="8" height="18" rx="1.5" fill="#00E58B" />
      <text x="314" y="30" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="11.5" font-weight="600" fill="#646B85">v4.2.0</text>
    </g>
  </g>

  <!-- ================= RIGHT STAGE: THE OPTICAL COMPILER APERTURE (x: 556 -> 1148) ================= -->

  <!-- Incoming Raw Beam & Outgoing Refracted Beam -->
  <path class="lens-flare" d="M 566 250 L 796 250" stroke="url(#beamIn)" stroke-width="3" />
  <polygon class="lens-flare" points="796,248 924,165 924,335 796,252" fill="url(#beamOut)" opacity="0.55" />

  <!-- LEFT OF LENS: Raw Uncompiled Prompt Sheet (Fluff Redaction) -->
  <g transform="translate(556, 152)" filter="url(#softElevation)">
    <rect x="0" y="0" width="216" height="196" rx="12" fill="#0E1018" stroke="#231D24" stroke-width="1.2" />
    <text x="20" y="32" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#6E748C" letter-spacing="0.04em">RAW INPUT</text>

    <!-- Fluff Token 1 (Outer group holds position; inner group holds CSS animation) -->
    <g transform="translate(20, 62)">
      <g class="raw-token-1">
        <text x="0" y="14" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" font-weight="500" fill="#FF6B4A">"You are a 10x expert"</text>
        <line class="strike-line" x1="-2" y1="9" x2="172" y2="9" stroke="#FF5A36" stroke-width="2" />
      </g>
    </g>

    <!-- Fluff Token 2 -->
    <g transform="translate(20, 102)">
      <g class="raw-token-2">
        <text x="0" y="14" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" font-weight="500" fill="#FF6B4A">"for tomorrow's demo"</text>
        <line class="strike-line" x1="-2" y1="9" x2="166" y2="9" stroke="#FF5A36" stroke-width="2" />
      </g>
    </g>

    <!-- Fluff Token 3 -->
    <g transform="translate(20, 142)">
      <g class="raw-token-3">
        <text x="0" y="14" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" font-weight="500" fill="#FF6B4A">"don't hallucinate"</text>
        <line class="strike-line" x1="-2" y1="9" x2="150" y2="9" stroke="#FF5A36" stroke-width="2" />
      </g>
    </g>
  </g>

  <!-- CENTER: 3D Angled Optical Compiler Lens Blade (x = 798) -->
  <g transform="translate(798, 250)">
    <ellipse class="lens-flare" cx="0" cy="0" rx="22" ry="148" fill="none" stroke="#00E58B" stroke-width="1" stroke-opacity="0.35" />
    <polygon points="-14,-136 14,-152 14,136 -14,152" fill="url(#glassLens)" stroke="url(#lensEdge)" stroke-width="1.5" filter="url(#softElevation)" />
    <line class="lens-flare" x1="0" y1="-144" x2="0" y2="144" stroke="#FFFFFF" stroke-width="2" filter="url(#opticalBloom)" />
    <circle class="lens-flare" cx="0" cy="0" r="5" fill="#FFFFFF" filter="url(#opticalBloom)" />
  </g>

  <!-- RIGHT OF LENS: Compiled Certificate Output Surface -->
  <g transform="translate(838, 126)" filter="url(#softElevation)">
    <rect x="0" y="0" width="306" height="248" rx="14" fill="#0D1219" stroke="#1D3B32" stroke-width="1.2" />

    <text x="24" y="36" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#00E58B" letter-spacing="0.04em">COMPILED CERTIFICATE</text>
    <rect x="210" y="19" width="72" height="24" rx="12" fill="#0B2920" stroke="#165640" stroke-width="1" />
    <text x="246" y="35" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#00E58B">+27.3%</text>

    <!-- Compiled Line 1: [P1] -->
    <g transform="translate(24, 68)">
      <g class="cert-row-1">
        <text x="0" y="16" font-family="'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="700" fill="#00E58B">[P1]</text>
        <text x="44" y="16" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#F5F3EC">Self-Contained Premises</text>
        <text x="44" y="36" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="400" fill="#8292A8">Goal-blind, zero persona fluff</text>
      </g>
    </g>

    <!-- Compiled Line 2: [T1] -->
    <g transform="translate(24, 128)">
      <g class="cert-row-2">
        <text x="0" y="16" font-family="'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="700" fill="#00E58B">[T1]</text>
        <text x="44" y="16" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#F5F3EC">Body-Level Call Trace</text>
        <text x="44" y="36" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="400" fill="#8292A8">Input -&gt; State -&gt; Invariant</text>
      </g>
    </g>

    <!-- Compiled Line 3: [V1] -->
    <g transform="translate(24, 188)">
      <g class="cert-row-3">
        <text x="0" y="16" font-family="'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="700" fill="#00E58B">[V1]</text>
        <text x="44" y="16" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#F5F3EC">Verified Self-Test Gate</text>
        <text x="44" y="36" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="400" fill="#00E58B">94.1% Frontier Win Rate</text>
      </g>
    </g>
  </g>
</svg>
