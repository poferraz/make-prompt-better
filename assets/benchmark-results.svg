  <text x="48" y="246" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#E2E8F0">GLM-5.1</text>
  <rect x="150" y="226" width="273" height="14" rx="4" fill="#334155"/>
  <text x="431" y="238" font-family="ui-monospace, monospace" font-size="11.5" fill="#94A3B8">19.5</text>
  <rect x="150" y="244" width="340" height="16" rx="4" fill="url(#barBlue)"/>
  <text x="498" y="257" font-family="ui-monospace, monospace" font-size="12.5" font-weight="700" fill="#38BDF8">24.3 (+24.6%)</text>

