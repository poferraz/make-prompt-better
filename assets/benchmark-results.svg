  <!-- v4.0 Empirical Callout Box -->
  <rect x="656" y="276" width="496" height="92" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.2"/>
  <text x="676" y="302" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#34D399">NEW EMPIRICAL GAINS IN v4.0 RESEARCH BASE:</text>
  <text x="676" y="324" font-family="-apple-system, sans-serif" font-size="12.5" fill="#E2E8F0">• <tspan font-weight="700" fill="#38BDF8">1.6x to 2.1x</tspan> creative diversity via Verbalized Sampling (arXiv:2510.01171)</text>
  <text x="676" y="344" font-family="-apple-system, sans-serif" font-size="12.5" fill="#E2E8F0">• <tspan font-weight="700" fill="#C084FC">98.0 macro-F1</tspan> AI SlopShape signature defense (arXiv:2609.15369)</text>
  <text x="676" y="364" font-family="-apple-system, sans-serif" font-size="12.5" fill="#E2E8F0">• <tspan font-weight="700" fill="#818CF8">+7.7 pts</tspan> &amp; <tspan font-weight="700" fill="#818CF8">-20% cost</tspan> via Meta-Harness &amp; AGENTS.md pruning</text>
</svg>
