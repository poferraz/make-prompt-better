    <text x="4" y="182" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="700" fill="#00E58B">+4.41 / 25</text>
    <text x="108" y="182" font-family="Inter, -apple-system, sans-serif" font-size="14.5" font-weight="500" fill="#F5F3EC">Creative &amp; Anti-SlopShape</text>

    <text x="4" y="218" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="700" fill="#00E58B">+3.11 / 25</text>
    <text x="108" y="218" font-family="Inter, -apple-system, sans-serif" font-size="14.5" font-weight="500" fill="#F5F3EC">Financial Due Diligence</text>
  </g>
</svg>
