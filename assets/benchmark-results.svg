      <rect x="196" y="2" width="232" height="14" rx="3" fill="#1C2133" />
      <rect class="delta-1" x="428" y="2" width="64" height="14" rx="3" fill="url(#liftGrad)" />
      <text x="510" y="15" font-family="'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="700" fill="#00E58B">+27.3%</text>
