<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="benchBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080C" />
      <stop offset="55%" stop-color="#0B0D14" />
      <stop offset="100%" stop-color="#080A10" />
    </linearGradient>

    <radialGradient id="proofAura" cx="78%" cy="48%" r="36%">
      <stop offset="0%" stop-color="#00E58B" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#07080C" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="liftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B870" />
      <stop offset="100%" stop-color="#00F59B" />
    </linearGradient>

    <style>
      .delta-1 {
        transform-box: fill-box;
        transform-origin: left center;
        animation: expandBar 5.5s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }
      .delta-2 {
        transform-box: fill-box;
        transform-origin: left center;
        animation: expandBar 5.5s cubic-bezier(0.16, 1, 0.3, 1) 0.12s infinite;
      }
      .delta-3 {
        transform-box: fill-box;
        transform-origin: left center;
        animation: expandBar 5.5s cubic-bezier(0.16, 1, 0.3, 1) 0.24s infinite;
      }
      .delta-4 {
        transform-box: fill-box;
        transform-origin: left center;
        animation: expandBar 5.5s cubic-bezier(0.16, 1, 0.3, 1) 0.36s infinite;
      }
      .delta-5 {
        transform-box: fill-box;
        transform-origin: left center;
        animation: expandBar 5.5s cubic-bezier(0.16, 1, 0.3, 1) 0.48s infinite;
      }

      @keyframes expandBar {
        0%, 66% { transform: scaleX(1); opacity: 1; }
        78%, 84% { transform: scaleX(0.15); opacity: 0.35; }
        96%, 100% { transform: scaleX(1); opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        .delta-1, .delta-2, .delta-3, .delta-4, .delta-5 {
          animation: none !important;
          transform: none !important;
          opacity: 1 !important;
        }
      }
    </style>
  </defs>

  <!-- Matte Stage -->
  <rect width="1200" height="400" rx="16" fill="url(#benchBg)" />
  <rect width="1200" height="400" rx="16" fill="url(#proofAura)" />
  <rect x="0.75" y="0.75" width="1198.5" height="398.5" rx="15.25" fill="none" stroke="#1E2231" stroke-width="1.5" />

  <!-- Subtle Vertical Divider -->
  <line x1="748" y1="56" x2="748" y2="344" stroke="#1C2030" stroke-width="1" />

  <!-- ================= LEFT: PROTOCOL-STRATIFIED BENCHMARK MATRIX (x: 56 -> 712) ================= -->
  <g transform="translate(56, 62)">
    <text x="0" y="0" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#F5F3EC" letter-spacing="-0.02em">Protocol-Stratified Benchmark (N = 164 Pairs)</text>
    <text x="468" y="0" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="500" fill="#8292A8">25-pt Self-Judged Rubric</text>

