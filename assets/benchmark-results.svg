      <rect x="210" y="2" width="220" height="14" rx="3" fill="#1C2133" />
      <rect class="delta-1" x="430" y="2" width="46" height="14" rx="3" fill="url(#liftGrad)" />
      <text x="492" y="15" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="700" fill="#00E58B">+3.29</text>
      <text x="562" y="15" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="500" fill="#8292A8">24.8/25</text>
    </g>

