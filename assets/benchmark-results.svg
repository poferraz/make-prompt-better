    <text x="0" y="56" font-family="Inter, -apple-system, sans-serif" font-size="76" font-weight="800" fill="#F5F3EC" letter-spacing="-0.04em">94.1%</text>
    <text x="4" y="88" font-family="Inter, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#00E58B">Frontier Model Win Rate</text>
    <text x="4" y="114" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#8292A8">108 wins across 146 blinded A/B pairs</text>

