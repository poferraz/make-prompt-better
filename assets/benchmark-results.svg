      <rect x="196" y="2" width="254" height="14" rx="3" fill="#1C2133" />
      <rect class="delta-4" x="450" y="2" width="28" height="14" rx="3" fill="url(#liftGrad)" />
      <text x="510" y="15" font-family="'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="700" fill="#00E58B">+11.2%</text>
      <text x="582" y="15" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" font-weight="500" fill="#8292A8">23.5/25</text>
    </g>

