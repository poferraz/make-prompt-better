    <g transform="translate(0, 282)">
      <text x="0" y="15" font-family="'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="500" fill="#8292A8">gpt-oss:20b</text>
      <rect x="196" y="2" width="218" height="14" rx="3" fill="#1C2133" />
      <rect x="392" y="2" width="22" height="14" rx="3" fill="#FF5A36" />
