      <text x="0" y="15" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="600" fill="#F5F3EC">argon-4-low (Session)</text>
      <rect x="210" y="2" width="226" height="14" rx="3" fill="#1C2133" />
      <rect class="delta-2" x="436" y="2" width="40" height="14" rx="3" fill="url(#liftGrad)" />
      <text x="492" y="15" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="700" fill="#00E58B">+2.88</text>
      <text x="562" y="15" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="500" fill="#8292A8">25.0/25</text>
    </g>

