    <!-- Row 6: 11-Model Cloud Mean (Forced Mode 1 Overhead) -->
    <g transform="translate(0, 282)">
      <text x="0" y="15" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="500" fill="#8292A8">11-Cloud Mean (Forced)</text>
      <rect x="210" y="2" width="204" height="14" rx="3" fill="#1C2133" />
      <rect x="380" y="2" width="34" height="14" rx="3" fill="#FF5A36" />
      <text x="492" y="15" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" font-weight="600" fill="#FF6B4A">-2.35 (3.57x bloat)</text>
    </g>
  </g>

  <!-- ================= RIGHT: STRATIFIED EVIDENCE ANCHOR (x: 788 -> 1152) ================= -->
  <g transform="translate(788, 76)">
    <text x="0" y="42" font-family="Inter, -apple-system, sans-serif" font-size="56" font-weight="800" fill="#F5F3EC" letter-spacing="-0.03em">+2.36 / 25</text>
    <text x="4" y="72" font-family="Inter, -apple-system, sans-serif" font-size="16.5" font-weight="600" fill="#00E58B">Frontier In-Session Track (31W-4T-1L)</text>
