    <line x1="4" y1="120" x2="356" y2="120" stroke="#1E2336" stroke-width="1" />

    <text x="4" y="152" font-family="'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="700" fill="#00E58B">+1.83 / 25</text>
    <text x="104" y="152" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#F5F3EC">T12 Code-First Concurrency (14 Models)</text>

    <text x="4" y="186" font-family="'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="700" fill="#00E58B">+1.50 / 25</text>
    <text x="104" y="186" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#F5F3EC">T2 Financial Due Diligence (8W-1T-4L)</text>

    <text x="4" y="220" font-family="'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="700" fill="#00E58B">+0.78 / 5.0</text>
    <text x="104" y="220" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#F5F3EC">Traceability Gain Across All 164 Pairs</text>

    <text x="4" y="254" font-family="'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="700" fill="#FF6B4A">-2.35 / 25</text>
    <text x="104" y="254" font-family="Inter, -apple-system, sans-serif" font-size="13.5" font-weight="400" fill="#8292A8">Isolated Cloud Track (Fixed in v4.3.0)</text>
