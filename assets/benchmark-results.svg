      <rect class="delta-5" x="454" y="2" width="24" height="14" rx="3" fill="url(#liftGrad)" />
      <text x="510" y="15" font-family="'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="700" fill="#00E58B">+9.3%</text>
      <text x="582" y="15" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" font-weight="500" fill="#8292A8">23.5/25</text>
    </g>

