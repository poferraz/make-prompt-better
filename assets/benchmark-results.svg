  <text x="48" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#94A3B8">Baseline prompt vs. Semi-Formal Certificate across 4 frontier model families</text>

  <!-- Gemini -->
  <text x="48" y="118" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#E2E8F0">Gemini</text>
  <rect x="150" y="98" width="287" height="14" rx="4" fill="#334155"/>
  <text x="445" y="110" font-family="ui-monospace, monospace" font-size="11.5" fill="#94A3B8">20.5</text>
