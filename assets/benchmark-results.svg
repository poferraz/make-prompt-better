      <rect x="210" y="2" width="225" height="14" rx="3" fill="#1C2133" />
      <rect x="427" y="2" width="8" height="14" rx="3" fill="#F5A623" />
      <text x="492" y="15" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="600" fill="#F5A623">-0.33</text>
      <text x="562" y="15" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="500" fill="#8292A8">0.85x words</text>
