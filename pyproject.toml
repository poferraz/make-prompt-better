[project]
name = "make-prompt-better"
version = "4.3.0"
description = "Model-Aware Prompt, Context, and Harness Compiler for AI Coding Agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Paulo Ferraz", email = "poferraz@users.noreply.github.com" },
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["research/benchmark/v4"]
