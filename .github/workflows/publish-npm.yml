name: npm package checks and publishing

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/publish-npm.yml'
      - 'package.json'
      - 'bin/**'
      - 'install.sh'
      - 'make-prompt-better/**'
      - 'scripts/npm_release.py'
      - 'tests/test_npm_release.py'
      - 'README.md'
      - 'docs/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-npm.yml'
      - 'package.json'
      - 'bin/**'
      - 'install.sh'
      - 'make-prompt-better/**'
      - 'scripts/npm_release.py'
      - 'tests/test_npm_release.py'
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      operation:
        description: 'preflight never uses npm credentials; check-token only authenticates; publish writes to npm'
        type: choice
        options: [preflight, check-token, publish]
        default: preflight
        required: true
      auth_mode:
        description: 'Publishing only: OIDC after trusted-publisher setup, or a temporary bootstrap token'
        type: choice
        options: [oidc, bootstrap-token]
        default: oidc
        required: true

permissions:
  contents: read

concurrency:
  group: npm-${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'preflight' }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: inputs.operation != 'check-token'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.package.outputs.tag }}
      integrity: ${{ steps.package.outputs.integrity }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require a published stable tag on validated main before publishing
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'poferraz/make-prompt-better' ]]
          [[ "$GITHUB_REF_TYPE" == 'tag' ]]
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          release_commit="$(git rev-parse HEAD)"
          [[ "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" == "$release_commit" ]]
          git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/npm-release.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$release_commit&event=push&per_page=100" > "$RUNNER_TEMP/npm-runs.json"
          python3 scripts/npm_release.py release --tag "$RELEASE_TAG" --commit "$release_commit" --release-file "$RUNNER_TEMP/npm-release.json" --runs-file "$RUNNER_TEMP/npm-runs.json"
          python3 scripts/npm_release.py registry --tag "$RELEASE_TAG"
      - name: Validate source
        run: |
          python3 scripts/check-release.py
          npm test
          npm run lint
          bash -n install.sh
      - name: Pack once, inspect, and test the actual artifact
        id: package
        env:
          OPERATION: ${{ inputs.operation }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$(node -p "require('./package.json').version")"
          if [[ "$OPERATION" == 'publish' ]]; then [[ "$tag" == "$RELEASE_TAG" ]]; fi
          mkdir -p "$RUNNER_TEMP/mpb-pack" dist
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/mpb-pack"
          mv "$RUNNER_TEMP/mpb-pack/"*.tgz dist/package.tgz
          python3 scripts/npm_release.py audit dist/package.tgz --tag "$tag" > dist/metadata.json
          python3 scripts/npm_release.py smoke dist/package.tgz --tag "$tag"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('dist/metadata.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for key in ('tag', 'integrity', 'sha256'):
                  out.write(f'{key}={data[key]}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Verified npm candidate\n\n')
              out.write(f"Tag label: `{data['tag']}`\n\nSHA-256: `{data['sha256']}`\n\n")
              out.write('Archive and filesystem smoke checks passed. Registry publication, host discovery, and token publishing rights are separate checks.\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-candidate-${{ github.run_id }}
          path: |
            dist/package.tgz
            dist/metadata.json
          if-no-files-found: error
          retention-days: 7

  token-check:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'check-token' && github.ref == 'refs/heads/main' && github.repository == 'poferraz/make-prompt-better'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm-publish
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Authenticate without publishing or exposing the token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';
          const token = process.env.NODE_AUTH_TOKEN;
          const report = (message) => {
            console.log(message);
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, message + '\n\n');
          };
          if (!token || token.trim() !== token || /\s/.test(token)) {
            report('Token check failed: NPM_TOKEN is empty or contains whitespace. Replace the environment secret with the exact token.');
            process.exit(1);
          }
          try {
            const response = await fetch('https://registry.npmjs.org/-/whoami', {
              headers: {Authorization: `Bearer ${token}`},
              redirect: 'error', signal: AbortSignal.timeout(30000),
            });
            if (!response.ok) {
              report(`npm rejected authentication with HTTP ${response.status}. Check expiry, revocation, account access, and allowed IP ranges. This status alone does not identify the cause.`);
              process.exit(1);
            }
            const body = await response.json();
            if (typeof body.username !== 'string' || !/^[a-zA-Z0-9_.-]{1,100}$/.test(body.username)) {
              report('Unexpected npm identity response; no response body or token was logged.');
              process.exit(1);
            }
            report(`npm accepted the stored token for account: ${body.username}.`);
            report('Authentication only. Package ownership, write/stage scope, Bypass 2FA, and permission to publish remain unverified. No package was published.');
          } catch {
            report('Token check could not reach or parse the npm identity service. No token or response body was logged.');
            process.exit(1);
          }
          JS

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'publish' && github.repository == 'poferraz/make-prompt-better'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-candidate-${{ github.run_id }}
          path: dist
      - name: Verify the artifact from this run before using credentials
        env:
          EXPECTED_INTEGRITY: ${{ needs.verify.outputs.integrity }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const actual = 'sha512-' + createHash('sha512').update(readFileSync('dist/package.tgz')).digest('base64');
          if (actual !== process.env.EXPECTED_INTEGRITY) throw new Error('Artifact integrity mismatch');
          JS
      - name: Publish with trusted OIDC identity
        if: inputs.auth_mode == 'oidc'
        run: npm publish dist/package.tgz --ignore-scripts --access public --registry=https://registry.npmjs.org --provenance
      - name: Publish with temporary bootstrap token
        if: inputs.auth_mode == 'bootstrap-token'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN"
          npm publish dist/package.tgz --ignore-scripts --access public --registry=https://registry.npmjs.org --provenance
      - name: Verify public registry identity and integrity
        env:
          EXPECTED_INTEGRITY: ${{ needs.verify.outputs.integrity }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          node --input-type=module <<'JS'
          const version = process.env.RELEASE_TAG.slice(1);
          const response = await fetch(`https://registry.npmjs.org/make-prompt-better/${version}`, {redirect: 'error', signal: AbortSignal.timeout(30000)});
          if (!response.ok) throw new Error(`Registry read-back failed: ${response.status}`);
          const data = await response.json();
          if (data.name !== 'make-prompt-better' || data.version !== version || data.dist?.integrity !== process.env.EXPECTED_INTEGRITY) throw new Error('Registry artifact mismatch');
          console.log(`Public registry identity and integrity verified for ${version}.`);
          JS
