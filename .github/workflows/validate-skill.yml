name: Validate Skill, Links & Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Verify source and integration behavior
        run: npm run verify

  regression:
    uses: ./.github/workflows/recurring-tests.yml

  package:
    uses: ./.github/workflows/npm-preflight.yml
    permissions:
      contents: read
      actions: read

  validate:
    if: always()
    needs: [source, regression, package]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every release gate to succeed
        env:
          GATE_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          results = json.loads(os.environ['GATE_RESULTS'])
          expected = {'source', 'regression', 'package'}
          failed = {name: results.get(name, {}).get('result', 'missing')
                    for name in expected if results.get(name, {}).get('result') != 'success'}
          if set(results) != expected or failed:
              sys.exit(f'Release gates failed: {failed}; received {sorted(results)}')
          print('All release gates passed: source, regression, package')
          PYTHON
